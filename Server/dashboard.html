<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출석 대시보드</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<header>
  <h1>
    📋 출석 현황 대시보드
    <span id="adminLoginBtn" class="admin-icon" onclick="AdminChanging()" title="관리자 로그인">⚙️</span>
    <span id="settingBtn" class="admin-icon" onclick="openSettingModal()" title="세팅" style="display:none;">🔧</span>
    <span id="statsBtn" class="admin-icon" onclick="openStatsModal()" title="학생 통계" style="display:none;">📊</span>

  </h1>
  <div style="display:flex; align-items:center; gap:1rem;">
    <div class="stats">
      <div class="stat-card present">
        <div class="num" id="presentCount">0</div>
        <div class="label">출석</div>
      </div>
      <div class="stat-card absent">
        <div class="num" id="absentCount">0</div>
        <div class="label">미출석</div>
      </div>
      <div class="stat-card">
        <div class="num" id="totalCount">0</div>
        <div class="label">전체</div>
      </div>
    </div>
    <button class="refresh-btn" onclick="loadSeats()">새로고침</button>
  </div>
</header>

<div class="classroom">
  <div class="board">칠판</div>

  <div id="swapGuide" style="display:none; text-align:center; background:#fff3cd; color:#856404; padding:0.6rem; border-radius:8px; margin-bottom:1rem; font-size:0.85rem;">
    📌 옮길 자리를 클릭하세요 &nbsp;
    <button onclick="cancelSwap()" style="background:#856404; color:white; border:none; border-radius:6px; padding:0.2rem 0.6rem; cursor:pointer; font-size:0.8rem;">취소</button>
  </div>

  <div class="seat-layout" id="seatLayout">
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot dot-present"></div> 출석</div>
    <div class="legend-item"><div class="legend-dot dot-empty"></div> 미출석</div>
    <div class="legend-item"><div class="legend-dot dot-unassigned"></div> 미배정</div>
  </div>
</div>

<div class="last-update" id="lastUpdate"></div>

<!-- 관리자 로그인 모달 -->
<div class="modal-overlay" id="adminLoginModal">
  <div class="modal-card">
    <div class="modal-name" style="margin-bottom:1.5rem;">🔐 관리자 로그인</div>
    <table class="modal-info-table">
      <tr>
        <td>아이디</td>
        <td><input id="adminId" type="text" placeholder="아이디" style="width:100%; border:1px solid #e0e0e0; border-radius:6px; padding:0.4rem 0.6rem; font-size:0.85rem;"></td>
      </tr>
      <tr>
        <td>비밀번호</td>
        <td><input id="adminPw" type="password" placeholder="비밀번호" style="width:100%; border:1px solid #e0e0e0; border-radius:6px; padding:0.4rem 0.6rem; font-size:0.85rem;"></td>
      </tr>
    </table>
    <div id="adminLoginError" style="color:#e74c3c; font-size:0.8rem; text-align:center; margin-bottom:0.75rem;"></div>
    <div style="display:flex; flex-direction:column; gap:0.6rem;">
      <button class="btn-swap" onclick="checkAdminLogin()">확인</button>
      <button class="btn-cancel" onclick="closeAdminLoginModal()">취소</button>
    </div>
  </div>
</div>

<!-- 알림 모달 -->
<div class="modal-overlay" id="alertModal">
  <div class="modal-card" style="text-align:center;">
    <div id="alertMessage" style="font-size:1rem; font-weight:600; color:#1a1a2e; margin-bottom:1.5rem;">-</div>
    <div style="display:flex; flex-direction:column; gap:0.6rem;">
      <button id="alertConfirmBtn" class="btn-delete" onclick="deleteMember()">삭제</button>
      <button id="alertCancelBtn" class="btn-cancel" onclick="closeAlertModal()">확인</button>
    </div>
  </div>
</div>

<!-- 회원 상세 정보 모달 -->
<div class="modal-overlay" id="memberModal" onclick="closeModal(event)">
  <div class="modal-card" id="modalCard">
    <div class="modal-actions">
      <button class="btn-swap" onclick="startSwap()">🔄 좌석 옮기기</button>
      <button class="btn-delete" onclick="confirmDelete()">🗑️ 회원 삭제</button>
    </div>

    <div class="modal-info-wrap">
      <div class="modal-name" id="modalName">-</div>
    </div>

    <table class="modal-info-table">
      <tr>
        <td>학번/ID</td>
        <td id="modalId">-</td>
      </tr>
      <tr>
        <td>좌석 번호</td>
        <td id="modalSeat">-</td>
      </tr>
      <tr>
        <td>출석 상태</td>
        <td id="modalStatus">-</td>
      </tr>
    </table>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModalDirect()">닫기</button>
    </div>
  </div>
</div>

<!-- 세팅 모달 -->
<div class="modal-overlay" id="settingModal">
  <div class="modal-card">
    <div class="modal-name" style="margin-bottom:1.5rem;">🔧 좌석 세팅</div>
    <table class="modal-info-table">
      <tr>
        <td>열 수</td>
        <td><input id="settingCol" type="number" min="1" value="3" style="width:100%; border:1px solid #e0e0e0; border-radius:6px; padding:0.4rem 0.6rem; font-size:0.85rem;"></td>
      </tr>
      <tr>
        <td>행 수</td>
        <td><input id="settingRow" type="number" min="1" value="5" style="width:100%; border:1px solid #e0e0e0; border-radius:6px; padding:0.4rem 0.6rem; font-size:0.85rem;"></td>
      </tr>
      <tr>
        <td>행당 좌석 수</td>
        <td><input id="settingSeatsInRow" type="number" min="1" value="2" style="width:100%; border:1px solid #e0e0e0; border-radius:6px; padding:0.4rem 0.6rem; font-size:0.85rem;"></td>
      </tr>
    </table>
    <div style="display:flex; flex-direction:column; gap:0.6rem;">
      <button class="btn-swap" onclick="applySettings()">적용</button>
      <button class="btn-cancel" onclick="closeSettingModal()">닫기</button>
    </div>
  </div>
</div>

<!-- 학생 출석 통계 모달 -->
<div class="modal-overlay" id="statsModal">
    <div class="modal-card" style="width: 500px; max-width: 95vw;">
        
        <div class="modal-name" style="margin-bottom:1.5rem;">📊 학생 출석 통계</div>
        
        <div style="overflow-x: auto; max-height: 400px; border-radius: 8px;">
            <table class="stats-table">
                <thead>
                    <tr>
                        <th>학생 ID</th>
                        <th>출석 ✅</th>
                        <th>지각 ⏰</th>
                        <th>조퇴 🏃</th>
                        <th>결석 ❌</th>
                    </tr>
                </thead>
                <tbody id="statsTableBody">
                    </tbody>
            </table>
        </div>
        
        <div style="margin-top: 1.5rem;">
            <button class="btn-cancel" onclick="closeStatsModal()">닫기</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
